<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>SMI WMS</title>

    <link rel="stylesheet" href="style.css">
    <link rel="icon" type="image/png" href="img/favicon.png">
</head>

<body>

    <div class="login-container">
        <div class="login-box">

            <div class="logo-login">
                <img
                    src="img/logo.png"
                    alt="SMI do Brasil"
                >
            </div>

            <h1>SMI WMS</h1>

            <p>Sistema de Gerenciamento de Estoque</p>

            <input
                type="email"
                id="usuario"
                placeholder="E-mail"
                aria-label="E-mail"
                autocomplete="username"
                autocapitalize="none"
                spellcheck="false"
            >

            <input
                type="password"
                id="senha"
                placeholder="Senha"
                aria-label="Senha"
                autocomplete="current-password"
            >

            <button
                type="button"
                id="btnLogin"
            >
                Entrar
            </button>

            <span id="erro" role="alert"></span>

        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="supabase.js"></script>
    <script src="app.js"></script>

</body>
</html>
