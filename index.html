<!DOCTYPE html>
<html lang="pt-BR">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>SMI WMS</title>

    <link
        rel="stylesheet"
        href="style.css"
    >

</head>

<body>

    <div class="login-container">

        <div class="login-box">

            <div class="logo-login">

                <img
                    src="img/logo.png"
                    alt="SMI do Brasil"
                >

            </div>

            <h1>SMI WMS</h1>

            <p>
                Sistema de Gerenciamento de Estoque
            </p>

            <input
                type="text"
                id="usuario"
                placeholder="Usuário"
                autocomplete="username"
            >

            <input
                type="password"
                id="senha"
                placeholder="Senha"
                autocomplete="current-password"
            >

            <button
                type="button"
                id="btnLogin"
                onclick="login()"
            >
                Entrar
            </button>

            <span id="erro"></span>

        </div>

    </div>

    <script src="app.js"></script>

</body>

</html>
